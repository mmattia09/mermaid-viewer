<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mermaid-viewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="group">
    <button id="open" class="btn" title="Sfoglia i file (⌘O)">Apri…</button>
    <span id="file" class="file" title="nessun file">nessun file</span>
    <span id="live" class="dot" title="stato aggiornamento live"></span>
  </div>

  <div class="group center">
    <button class="btn icon" data-zoom="out" title="Zoom indietro (−)">−</button>
    <button id="zoomLabel" class="btn wide" title="Ripristina zoom 100% (0)">100%</button>
    <button class="btn icon" data-zoom="in" title="Zoom avanti (+)">+</button>
    <button class="btn" id="fit" title="Adatta alla finestra (F)">Adatta</button>
  </div>

  <div class="group right">
    <select id="engine" class="btn" aria-label="Motore di rendering"><option value="pele">Pele</option><option value="mermaid">Mermaid</option></select>
    <label class="chk" title="Adatta il diagramma alla larghezza disponibile"><input type="checkbox" id="responsive" checked> Responsive</label>
    <label class="chk" title="Interpreta **grassetto**, *corsivo* e `codice` dentro le celle">
      <input type="checkbox" id="md" checked> Markdown
    </label>
    <select id="theme" class="btn" title="Tema del diagramma">
      <option value="auto">Tema: auto</option>
      <option value="default">Chiaro</option>
      <option value="dark">Scuro</option>
      <option value="neutral">Neutro</option>
      <option value="forest">Forest</option>
    </select>
    <div class="menu">
      <button class="btn" id="exportBtn" title="Esporta">Esporta ▾</button>
      <div class="dropdown" id="exportMenu" hidden>
        <button data-export="svg">SVG</button>
        <button data-export="png@1">PNG 1×</button>
        <button data-export="png@2">PNG 2×</button>
        <button data-export="png@4">PNG 4×</button>
        <button data-export="pdf">PDF</button>
      </div>
    </div>
  </div>
</header>

<main id="stage" class="stage" tabindex="0">
  <div id="canvas" class="canvas"></div>
  <div id="drop" class="drop">
    <p>Apri un file per iniziare</p>
    <p class="small">premi <kbd>⌘O</kbd> · oppure trascina qui un <code>.mmd</code></p>
  </div>
</main>

<div id="picker" class="picker" hidden>
  <div class="sheet">
    <header>
      <strong>Apri un diagramma</strong>
      <button class="btn icon" id="pickerClose" title="Chiudi (esc)">×</button>
    </header>
    <nav id="crumbs" class="crumbs"></nav>
    <ul id="listing" class="listing"></ul>
    <footer id="recents" class="recents"></footer>
  </div>
</div>

<div id="err" class="err" hidden></div>
<div id="toast" class="toast" hidden></div>


<script src="/app.js" type="module"></script>
</body>
</html>
